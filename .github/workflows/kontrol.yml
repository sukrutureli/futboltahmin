name: Kontrol – Build and Deploy to GitHub Pages

env:
  MODE: kontrol

on:
  schedule:
    # UTC: 23,4,16,19
    - cron: '0 23,4,16,19 * * *'
  workflow_dispatch:

jobs:
  scraper:
    runs-on: ubuntu-latest
    container:
      image: selenium/standalone-chrome:4.14.1-20231025
      options: --user root --shm-size=4gb

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Fix apt sources and install Maven
        run: |
          sed -i 's|http://archive.ubuntu.com|https://archive.ubuntu.com|g' /etc/apt/sources.list
          sed -i 's|http://security.ubuntu.com|https://security.ubuntu.com|g' /etc/apt/sources.list
          apt-get update
          apt-get install -y maven

      - name: Verify tools
        run: |
          java -version
          mvn -version

      - name: Run Kontrol Scraper
        run: |
          echo "🚀 kontrol modu başlatılıyor..."
          mvn clean compile exec:java -Dexec.args="kontrol"

      - name: Upload public directory as artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-html
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: scraper

    steps:
      - name: Download public directory artifact
        uses: actions/download-artifact@v4
        with:
          name: public-html
          path: ./public

      - name: Push updated files to sukrutureli/fathertahmin
        env:
          TOKEN: ${{ secrets.ADMIN_USER }}
        run: |
          echo "🔹 Cloning target repo..."
          git clone "https://x-access-token:${TOKEN}@github.com/sukrutureli/fathertahmin.git" target-repo
          cd target-repo

          echo "🔹 Copying updated files from public/..."
          cp -r ../public/* .

          echo "🔹 Committing changes..."
          git config user.name "Şükrü Türeli"
          git config user.email "sukrutureli@gmail.com"
          git add .
          git commit -m "📦 [KONTROL] Auto update public HTML ($(date +'%Y-%m-%d %H:%M'))" || echo "No changes to commit"

          echo "🔹 Pushing to main branch..."
          git push origin main
