name: Futbol – Build and Deploy to GitHub Pages

env:
  GITHUB_TOKEN: ${{ secrets.ADMIN_USER }}
  MODE: futbol

on:
  schedule:
    # ⚽ FUTBOL – şu an için *UTC 21:00* (TSİ 00:00 civarı)
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  scraper:
    runs-on: ubuntu-latest
    container:
      image: selenium/standalone-chrome:4.14.1-20231025
      options: --user root --shm-size=4gb

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Maven
        run: |
          apt-get update
          apt-get install -y maven

      - name: Run Futbol Scraper
        run: |
          echo "🚀 futbol modu başlatılıyor..."
          mvn clean compile exec:java -Dexec.args="futbol"

      - name: Upload public directory as artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-html
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: scraper

    steps:
      - name: Download public directory artifact
        uses: actions/download-artifact@v4
        with:
          name: public-html
          path: ./public

      - name: Push updated files to sukrutureli/fathertahmin
        env:
          TOKEN: ${{ secrets.ADMIN_USER }}
        run: |
          echo "🔹 Cloning target repo..."
          git clone "https://x-access-token:${TOKEN}@github.com/sukrutureli/fathertahmin.git" target-repo
          cd target-repo

          echo "🔹 Copying updated files from public/..."
          cp -r ../public/* .

          echo "🔹 Committing changes..."
          git config user.name "Şükrü Türeli"
          git config user.email "sukrutureli@gmail.com"
          git add .
          git commit -m "📦 [FUTBOL] Auto update public HTML ($(date +'%Y-%m-%d %H:%M'))" || echo "No changes to commit"

          echo "🔹 Pushing to main branch..."
          git push origin main
